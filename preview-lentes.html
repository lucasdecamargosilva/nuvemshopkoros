<title>Escolher Lentes Koros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --pg-bg:#f7f4ef; --pg-card:#ffffff; --pg-ink:#1b1712; --pg-muted:#6d6459;
  --pg-line:#e4ddd1; --pg-soft:#efe9df; --accent:#f39c12; --accent-dp:#b9770e;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --pg-bg:#16130f; --pg-card:#1f1a14; --pg-ink:#f1ece3; --pg-muted:#a39889;
    --pg-line:#302920; --pg-soft:#251f18; --accent:#f7ae3a; --accent-dp:#f39c12;
  }
}
:root[data-theme="dark"]{
  --pg-bg:#16130f; --pg-card:#1f1a14; --pg-ink:#f1ece3; --pg-muted:#a39889;
  --pg-line:#302920; --pg-soft:#251f18; --accent:#f7ae3a; --accent-dp:#f39c12;
}
*{box-sizing:border-box}
body{margin:0;background:var(--pg-bg);color:var(--pg-ink);
  font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:432px;margin:0 auto;padding:40px 20px 64px;display:flex;flex-direction:column;gap:26px}

.pg-head{display:flex;flex-direction:column;gap:11px}
.pill{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;
  background:var(--accent);color:#1b1712;border-radius:999px;padding:5px 13px;
  font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.pg-head h1{margin:0;font-size:clamp(26px,4vw,38px);font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.pg-head p{margin:0;max-width:64ch;color:var(--pg-muted)}


/* --- mock: identidade da loja, sempre claro --- */
.phone{background:#fff;border:1px solid #e8e8e8;border-radius:20px;
  box-shadow:0 18px 44px rgba(27,23,18,.16);overflow:hidden;color:#111}
.ph-top{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:15px 20px;border-bottom:1px solid #e8e8e8;background:#fffdf6}
.ph-top img{height:26px;width:auto}
.ph-top span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#999}
.ph-body{padding:22px 20px 26px}

.passos{display:flex;gap:5px;margin-bottom:20px}
.passos i{height:3px;flex:1;background:#e8e8e8;border-radius:2px;transition:background .25s}
.passos i.on{background:#111}
.passos i.done{background:var(--accent-dp);opacity:.55}

.slabel{display:block;font-size:15px;font-weight:600;margin-bottom:14px;line-height:1.35;color:#111}
.opt{width:100%;text-align:left;background:#fff;border:1.5px solid #e8e8e8;border-radius:14px;
  padding:14px 15px;margin-bottom:10px;cursor:pointer;font-family:inherit;
  display:flex;flex-direction:column;gap:2px;transition:border-color .18s,background .18s}
.opt:hover{border-color:#111;background:#fffdf6}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt-t{font-size:14px;font-weight:500;color:#111}
.opt-s{font-size:11.5px;color:#999;line-height:1.45}

.olho{border:1.5px solid #e8e8e8;border-radius:13px;padding:12px 13px;margin-bottom:11px}
.olho-tag{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#999;font-weight:600;display:block;margin-bottom:9px}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.campos.um{grid-template-columns:1fr}
.campos label{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:#999;display:flex;flex-direction:column;gap:4px}
.campos select{border:1.5px solid #e8e8e8;border-radius:9px;padding:8px 6px;font-size:13px;
  font-family:'IBM Plex Mono',ui-monospace,monospace;background:#fff;color:#111}
.campos select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.btn{width:100%;height:50px;border:none;border-radius:14px;background:#111;color:#fff;
  font-family:inherit;font-size:12.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  cursor:pointer;transition:opacity .2s;margin-top:4px}
.btn:hover{opacity:.87}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.amber{background:var(--accent);color:#1b1712}
.btn.ghost{background:#fff;color:#111;border:1.5px solid #111;margin-top:9px}
.linkish{display:block;text-align:center;font-size:11.5px;color:#999;text-decoration:underline;
  cursor:pointer;margin-top:12px;background:none;border:none;width:100%;font-family:inherit}
.linkish:hover{color:#111}

.card-lente{border:2px solid #111;border-radius:14px;padding:16px;margin-bottom:12px}
.card-lente img{width:100%;max-width:168px;height:auto;display:block;margin:0 auto 12px;border-radius:10px;background:#fffdf6}
.cl-nome{font-size:14px;font-weight:600;line-height:1.35;color:#111}
.cl-preco{font-size:26px;font-weight:600;margin-top:8px;font-family:'IBM Plex Mono',monospace;color:#111}
.cl-parc{font-size:11.5px;color:#999}
.cl-pq{background:#fffdf6;border-radius:10px;padding:11px 12px;margin-top:12px;font-size:12px;line-height:1.5;color:#111}
.cl-pq b{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:#999;margin-bottom:4px;font-weight:600}
.alt-t{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:#999;font-weight:600;margin:16px 0 8px}
.opt.linha{flex-direction:row;align-items:center;gap:11px}
.opt.linha img{width:48px;height:48px;object-fit:contain;border-radius:9px;background:#fffdf6;flex-shrink:0}
.opt.linha .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.ajuda{margin:-6px 0 14px;font-size:12.5px;color:#999;line-height:1.5}
.lendo{display:flex;flex-direction:column;align-items:center;gap:11px;padding:24px 10px;font-size:12.5px;color:#999}
.lendo[hidden]{display:none}
.lendo-arq,#lendo-arq{font-size:11px;font-weight:600;color:#111;word-break:break-all;text-align:center;max-width:220px}
.spin{width:26px;height:26px;border:2.5px solid #e8e8e8;border-top-color:#111;border-radius:50%;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.banner{background:#fffdf6;border:1px solid #e8e8e8;border-radius:11px;padding:11px 13px;
  font-size:11.5px;line-height:1.5;color:#111;margin-bottom:14px}
.erro{background:#fff5f5;border:1px solid #fbc4c4;border-radius:11px;padding:11px 13px;
  font-size:11.5px;line-height:1.55;color:#9b2c2c;margin-bottom:10px}
.vazio{border:1.5px dashed #e8e8e8;border-radius:14px;padding:22px 16px;text-align:center;font-size:12.5px;color:#999;line-height:1.6}
.vazio b{display:block;color:#111;font-size:14px;font-weight:600;margin-bottom:6px}


@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const BRL = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmt = v => v==null ? '—' : (v>0?'+':'') + v.toFixed(2).replace('.',',');
const el = id => document.getElementById(id);

/* ---- estado ---- */
let S = { visao:null, trat:null, odEsf:0, odCil:0, oeEsf:0, oeCil:0, adicao:1.5 };

/* Pior olho: maior módulo preservando o sinal — a grade é assimétrica. */
const pior = (a,b) => Math.abs(a) >= Math.abs(b) ? a : b;

/* Uma lente serve se cobre o grau do pior olho, o tipo de visão e o tratamento. */
function serve(l, esf, cil, add, ignoraTrat){
  if (l.semgrau) return false;
  if (l.visao !== S.visao) return false;
  if (!ignoraTrat){
    if (S.trat === 'ar'       && (l.blue || l.foto)) return false;
    if (S.trat === 'blue'     && (!l.blue || l.foto)) return false;
    if (S.trat === 'foto'     && (!l.foto || l.blue)) return false;
    if (S.trat === 'fotoblue' && (!l.foto || !l.blue)) return false;
  }
  if (esf < 0){ if (l.neg == null || esf < l.neg) return false; }
  if (esf > 0){ if (l.pos == null || esf > l.pos) return false; }
  if (cil < 0){ if (l.cil == null || cil < l.cil) return false; }
  if (S.visao === 'multifocal' && add != null){ if (l.add == null || add > l.add) return false; }
  return true;
}


/* ---- passos ---- */
function marcaPassos(i){
  el('passos').innerHTML = [0,1,2,3].map(k=>`<i class="${k<i?'done':k===i?'on':''}"></i>`).join('');
}

function opcoes(rotulo, itens, aoEscolher, voltar){
  marcaPassos(itens.passo);
  el('tela').innerHTML = `<span class="slabel">${rotulo}</span>` +
    itens.map((o,i)=>`<button class="opt" data-i="${i}">
      <span class="opt-t">${o.t}</span><span class="opt-s">${o.s}</span></button>`).join('') +
    (voltar?`<button class="linkish" id="voltar">voltar</button>`:'');
  el('tela').querySelectorAll('.opt').forEach(b=>
    b.onclick = () => aoEscolher(itens[+b.dataset.i]));
  if (voltar) el('voltar').onclick = voltar;
}

/* ---- 1. visão ---- */
function telaVisao(){
  marcaPassos(0);
  const itens = [
    {v:'simples',    t:'Visão simples',  s:'Para perto <b>ou</b> para longe'},
    {v:'multifocal', t:'Multifocal',     s:'Para perto <b>e</b> para longe, na mesma lente'},
    {v:'semgrau',    t:'Sem grau',       s:'Só quero o tratamento (descanso)'}
  ];
  el('tela').innerHTML = `<span class="slabel">Que tipo de lente você usa?</span>` +
    itens.map((o,i)=>`<button class="opt" data-i="${i}">
      <span class="opt-t">${o.t}</span><span class="opt-s">${o.s}</span></button>`).join('');
  el('tela').querySelectorAll('.opt').forEach(b=> b.onclick = () => {
    const o = itens[+b.dataset.i];
    S.visao = o.v;
    if (o.v === 'semgrau') return telaSemGrau();
    telaTratamento();
  });
}

/* ---- sem grau: atalho ---- */
function telaSemGrau(){
  marcaPassos(2);
  const l = LENTES.find(x=>x.semgrau);
  el('tela').innerHTML = `<span class="slabel">A lente de descanso</span>` + cardHTML(l, 'Sem grau, com filtro de luz azul e antirreflexo.') +
    `<button class="btn amber">Comprar armação + lente</button>
     <button class="btn ghost">Comprar só a armação</button>
     <button class="linkish" id="voltar">voltar</button>`;
  el('voltar').onclick = telaVisao;
}

/* ---- 2. tratamento ---- */
function telaTratamento(){
  marcaPassos(1);
  const itens = [
    {v:'ar',       t:'Antirreflexo',                     s:'O essencial, para o dia a dia'},
    {v:'blue',     t:'Antirreflexo + filtro de luz azul',s:'Para quem passa o dia em telas'},
    {v:'foto',     t:'Fotossensível',                    s:'Escurece no sol, clareia dentro de casa'},
    {v:'fotoblue', t:'Fotossensível + filtro de luz azul',s:'Escurece no sol <b>e</b> protege das telas'}
  ];
  el('tela').innerHTML = `<span class="slabel">Qual tratamento você quer?</span>` +
    itens.map((o,i)=>`<button class="opt" data-i="${i}">
      <span class="opt-t">${o.t}</span><span class="opt-s">${o.s}</span></button>`).join('') +
    `<button class="linkish" id="voltar">voltar</button>`;
  el('tela').querySelectorAll('.opt').forEach(b=> b.onclick = () => {
    S.trat = itens[+b.dataset.i].v;
    telaReceita();
  });
  el('voltar').onclick = telaVisao;
}


/* ---- 3. receita: como o cliente informa o grau ---- */

  marcaPassos(2);
  el('tela').innerHTML = `<span class="slabel">Agora, sua receita</span>
    <p class="ajuda">Precisamos do seu grau para indicar a lente certa.</p>
    <input type="file" id="arquivo" accept="image/*,application/pdf" hidden>
    <button class="opt" id="op-enviar">
      <span class="opt-t">Enviar minha receita</span>
      <span class="opt-s">Tire uma foto ou anexe o arquivo &mdash; a gente lê pra você</span></button>
    <button class="opt" id="op-digitar">
      <span class="opt-t">Digitar os dados</span>
      <span class="opt-s">Prefiro preencher os campos eu mesma</span></button>
    <button class="opt" id="op-semreceita">
      <span class="opt-t">Não tenho receita</span>
      <span class="opt-s">Falar com a ótica no WhatsApp &mdash; a gente te ajuda</span></button>
    <div id="lendo" class="lendo" hidden>
      <div class="spin"></div>
      <div id="lendo-arq"></div>
      <div>Lendo sua receita…</div>
    </div>
    <button class="linkish" id="voltar">voltar</button>`;
  el('voltar').onclick = telaTratamento;
  el('op-digitar').onclick = () => { S.origem = 'digitado'; telaGrau(); };
  el('op-semreceita').onclick = telaSemReceita;
  el('op-enviar').onclick = () => el('arquivo').click();
  el('arquivo').onchange = (e) => {
    const f = e.target.files && e.target.files[0];
    if (f) lerReceita(f);
  };
}

/* Leitura da receita: MESMO endpoint que a Maxilook usa (pl-ler-receita).
   Devolve {ok, dados:{odEsf,oeEsf,odCil,oeCil,adicao,confianca}}. */
const WEBHOOK_RECEITA = 'https://n8n.segredosdodrop.com/webhook/pl-ler-receita';

function lerReceita(f){
  el('op-enviar').hidden = el('op-digitar').hidden = el('op-semreceita').hidden = true;
  el('lendo-arq').textContent = f.name;
  el('lendo').hidden = false;
  const fr = new FileReader();
  fr.onerror = () => falhaLeitura('Não consegui abrir o arquivo.');
  fr.onload = () => {
    const b64 = String(fr.result).split(',')[1];
    fetch(WEBHOOK_RECEITA, { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ image:b64, mime: f.type || 'image/png' }) })
      .then(r => r.json())
      .then(r => {
        if (!r || !r.ok) return falhaLeitura(
          r && r.erro === 'nao_e_receita' ? 'Não identifiquei uma receita nessa imagem.'
                                          : 'Não consegui ler sua receita.');
        const d = r.dados || {};
        const perto = (v, lista) => v == null ? null
          : lista.reduce((a,b) => Math.abs(b-v) < Math.abs(a-v) ? b : a);
        const esf = passosNum(-12,6,0.25), cil = passosNum(-6,0,0.25), add = passosNum(0.75,3.5,0.25);
        if (d.odEsf != null) S.odEsf = perto(d.odEsf, esf);
        if (d.oeEsf != null) S.oeEsf = perto(d.oeEsf, esf);
        if (d.odCil != null) S.odCil = perto(d.odCil, cil);
        if (d.oeCil != null) S.oeCil = perto(d.oeCil, cil);
        if (d.adicao != null) S.adicao = perto(d.adicao, add);
        S.origem = 'arquivo'; S.arquivo = f.name; S.confianca = d.confianca;
        telaGrau();
      })
      .catch(() => falhaLeitura('A leitura falhou — pode ser a conexão.'));
  };
  fr.readAsDataURL(f);
}

function falhaLeitura(msg){
  el('lendo').hidden = true;
  el('op-enviar').hidden = el('op-digitar').hidden = el('op-semreceita').hidden = false;
  const box = document.createElement('div');
  box.className = 'erro';
  box.innerHTML = msg + ' Tente outra foto ou digite os dados.';
  el('tela').insertBefore(box, el('lendo'));
}

function telaSemReceita(){
  marcaPassos(3);
  el('tela').innerHTML = `<span class="slabel">A ótica te ajuda</span>
    <div class="vazio"><b>Sem receita, sem problema</b>
      A Koros faz o exame e monta sua lente. É só chamar no WhatsApp que a gente resolve junto.</div>
    <button class="btn amber" style="margin-top:12px">Falar com a ótica</button>
    <button class="btn ghost">Comprar só a armação</button>
    <button class="linkish" id="voltar">voltar</button>`;
  el('voltar').onclick = telaReceita;
}

/* ---- 4. grau ---- */
const passosNum = (de,ate,st) => { const a=[]; for(let v=de; v<=ate+1e-9; v+=st) a.push(+v.toFixed(2)); return a; };
function selHTML(campo, valores, atual){
  return `<select data-c="${campo}">` + valores.map(v=>
    `<option value="${v}" ${v===atual?'selected':''}>${fmt(v)}</option>`).join('') + `</select>`;
}
function telaGrau(){
  marcaPassos(3);
  const esf = passosNum(-12,6,0.25), cil = passosNum(-6,0,0.25), add = passosNum(0.75,3.5,0.25);
  const banner = S.origem === 'arquivo'
    ? `<div class="banner">${S.confianca === 'baixa'
          ? `A imagem ficou difícil de ler. <b>Confira cada número com atenção.</b>`
          : `Preenchemos com o que lemos em <b>${S.arquivo}</b>. Confira e corrija se precisar.`}</div>` : '';
  el('tela').innerHTML = `<span class="slabel">Qual o seu grau?</span>` + banner + `
    <div class="olho"><span class="olho-tag">Olho direito (OD)</span>
      <div class="campos">
        <label>Esférico${selHTML('odEsf',esf,S.odEsf)}</label>
        <label>Cilíndrico${selHTML('odCil',cil,S.odCil)}</label>
      </div></div>
    <div class="olho"><span class="olho-tag">Olho esquerdo (OE)</span>
      <div class="campos">
        <label>Esférico${selHTML('oeEsf',esf,S.oeEsf)}</label>
        <label>Cilíndrico${selHTML('oeCil',cil,S.oeCil)}</label>
      </div></div>
    ${S.visao==='multifocal' ? `<div class="olho"><span class="olho-tag">Adição &mdash; o grau de perto</span>
      <div class="campos um"><label>Adição${selHTML('adicao',add,S.adicao)}</label></div></div>` : ''}
    <button class="btn" id="ver">Ver minha lente</button>
    <button class="linkish" id="voltar">voltar</button>`;
  el('tela').querySelectorAll('select').forEach(s=>
    s.onchange = () => { S[s.dataset.c] = parseFloat(s.value); });
  el('ver').onclick = telaResultado;
  el('voltar').onclick = telaReceita;
}


/* O que essa lente entrega, em palavras do cliente. */
function tratamentoDe(l){
  const t = [];
  if (l.ar) t.push('antirreflexo');
  if (l.blue) t.push('filtro de luz azul');
  if (l.foto) t.push('escurece no sol');
  const campo = /top id/i.test(l.nome) ? 'super campo de visão'
              : /light/i.test(l.nome)  ? 'campo de visão padrão' : '';
  return [campo, t.join(' + ')].filter(Boolean).join(' · ');
}

/* ---- 5. resultado ---- */
function cardHTML(l, porque){
  return `<div class="card-lente">
    ${l.img?`<img src="${l.img}" alt="" loading="lazy">`:''}
    <div class="cl-nome">${l.nome}</div>
    <div class="cl-preco">${BRL(l.preco)}</div>
    <div class="cl-parc">ou 6x de ${BRL(l.preco/6)} sem juros</div>
    <div class="cl-pq"><b>Por que essa</b>${porque}</div>
  </div>`;
}
function telaResultado(){
  const esf = pior(S.odEsf, S.oeEsf), cil = pior(S.odCil, S.oeCil);
  const add = S.visao==='multifocal' ? S.adicao : null;
  const cabe   = LENTES.filter(l=>serve(l,esf,cil,add,true)).sort((a,b)=>a.preco-b.preco);
  const pedido = cabe.filter(l=>serve(l,esf,cil,add,false));
  const outras = cabe.filter(l=>!pedido.includes(l));
  const grau = `${fmt(esf)} esférico, ${fmt(cil)} cilíndrico`;

  const lista = (arr, titulo) => arr.length ? `<div class="alt-t">${titulo}</div>` + arr.map(l=>`
      <button class="opt linha">
        ${l.img?`<img src="${l.img}" alt="" loading="lazy">`:''}
        <span class="txt"><span class="opt-t">${l.nome}</span>
        <span class="opt-s">${BRL(l.preco)} &middot; ${tratamentoDe(l)}</span></span>
      </button>`).join('') : '';

  const rodape = `<button class="btn amber" style="margin-top:14px">Comprar armação + lente</button>
     <button class="btn ghost">Comprar só a armação</button>
     <button class="linkish" id="voltar">voltar e mudar o grau</button>`;

  if (!cabe.length){
    el('tela').innerHTML = `<span class="slabel">Esse grau a gente monta sob medida</span>
      <div class="vazio"><b>Nenhuma lente pronta atende</b>
        Seu grau (${grau}) está fora da grade de estoque. A ótica monta sob medida &mdash;
        é só chamar no WhatsApp.</div>
      <button class="btn amber" style="margin-top:12px">Falar com a ótica</button>
      <button class="btn ghost">Comprar só a armação</button>
      <button class="linkish" id="voltar">voltar e mudar o grau</button>`;
    el('voltar').onclick = telaGrau;
    return;
  }

  if (!pedido.length){
    el('tela').innerHTML = `<span class="slabel">O tratamento que você pediu não existe nesse grau</span>
      <div class="vazio">Para ${grau} não temos lente com o tratamento escolhido.
        Estas atendem seu grau &mdash; veja se alguma serve.</div>`
      + lista(outras, 'Servem para o seu grau') + rodape;
    el('voltar').onclick = telaGrau;
    return;
  }

  const [primeira, ...resto] = pedido;
  el('tela').innerHTML = `<span class="slabel">Essa é a sua lente</span>` +
    cardHTML(primeira, `Atende seu grau (${grau}) e tem ${tratamentoDe(primeira)}.`) +
    lista(resto, 'Outras com o mesmo tratamento') +
    lista(outras, 'Outras que também servem para o seu grau') +
    rodape;
  el('voltar').onclick = telaGrau;
}


telaVisao();
</script>
